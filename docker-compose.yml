services:
  nginx:
    image: nginx:1.25-alpine
    container_name: rehab_app_nginx
    restart: always
    ports:
      # ロードバランサーからの通信(HTTP)を受け取る
      - "80:80"
    volumes:
      # 作成した設定ファイルを読み込ませる
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # CSSファイルなどをNginxが読めるように共有する
      - ./app/web/static:/usr/share/nginx/html/static:ro
    depends_on:
      - web
    networks:
      - rehabnet
      
  # Flaskアプリケーション (web)
  web:
    build: . # カレントディレクトリのDockerfileを使用
    container_name: rehab_app_web
    # user は指定しない。Dockerfile の USER appuser (uid 1000) で実行する。
    restart: always
    expose:            # Docker内部でのみ8080番を開放
      - "8080"
    # 起動コマンドは Dockerfile の CMD に一本化している (ここで上書きしない)
    # ports:
    #   # [ローカルPCのポート]:[コンテナ内のポート]
    #   - "5000:8080" # http://localhost:5000 でアクセス可能に
    env_file:
      - .env # .envファイルから環境変数を読み込む
    volumes:
      # RAG (ChromaDB) データをローカルに永続化
      # ※パスは rag_config.yaml の active_pipeline の設定に合わせてください
      # 例: active_pipeline: "raptor_experiment" の場合
      - ./rag_db_data:/app/Rehab_RAG/experiments/hybrid_search_experiment/db
      # ログをローカルでも確認 (任意)
      # 【Linuxホストの場合】このディレクトリが存在しないと Docker が root 所有で
      # 作成し、非rootで動くコンテナが書き込めません。事前に
      #   mkdir -p logs rag_db_data && sudo chown -R 1000:1000 logs rag_db_data
      # を実行してください（書けない場合もアプリは標準出力へのログ出力で継続します）。
      - ./logs:/app/logs

    networks:
      - rehabnet
    depends_on:
      # MySQLが接続を受け付けられる状態になるまで起動を待つ。
      # 短縮構文(- db)ではコンテナの起動しか待たないため、初回起動時に
      # schema.sqlの実行が終わる前にwebが立ち上がり、リクエストが全て500になる。
      db:
        condition: service_healthy

  # MySQLデータベース (db)
  db:
    image: mysql:8.0
    container_name: rehab_app_db
    restart: always
    # 日本語(絵文字含む)を正しく保存するための文字コード設定
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    # env_file は付けない。付けると SECRET_KEY や GOOGLE_API_KEY まで
    # MySQLコンテナに注入されてしまう。必要な値は下の environment で
    # トップレベル補間(同じ .env が参照される)から明示的に渡す。
    environment:
      # 認証情報は .env を唯一の情報源とする。未設定なら起動時に失敗させる。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD が .env に設定されていません}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME が .env に設定されていません}
      MYSQL_USER: ${DB_USER:?DB_USER が .env に設定されていません}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD が .env に設定されていません}
    volumes:
      # データはDocker管理の名前付きボリュームに置く。
      # リポジトリ配下へのバインドマウントは、OneDrive同期による破損と
      # git add -A での誤コミットの両方を招くため使わない。
      - mysql_data:/var/lib/mysql
      # 初期化用のSQLファイルをマウント (コンテナ初回起動時に自動実行されます)
      - ./schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      # 開発用サンプルデータ (患者・計画書のみ)。本番環境ではこの行を外してください。
      - ./seed_dev.sql:/docker-entrypoint-initdb.d/2_seed_dev.sql
    # ポートはホストへ公開しない。webは同一ネットワーク上で db:3306 に到達できる。
    # DBクライアントで接続したい場合のみ、以下をループバック限定で有効化する。
    # ports:
    #   - "127.0.0.1:3307:3306"
    expose:
      - "3306"
    healthcheck:
      # 必ず 127.0.0.1 を指定してTCP経由で確認する。
      # "localhost" だとUnixソケット接続になり、initdb中の一時サーバ
      # (TCP 3306では待ち受けていない) にも通ってしまうため、
      # webが早すぎるタイミングで起動して Connection refused になる。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - rehabnet

# コンテナ間通信用のネットワーク
networks:
  rehabnet:
    driver: bridge

volumes:
  mysql_data: